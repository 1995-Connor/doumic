name: macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/macos-dmg.yml"
      - "macos/packaging/**"

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package DMG
        run: |
          chmod +x macos/packaging/create_dmg.sh
          macos/packaging/create_dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: doumai-macos-dmg
          path: releases/doumai-macos.dmg
          if-no-files-found: error
          retention-days: 30
